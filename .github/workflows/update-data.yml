name: Update public data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 5 * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check pandas
      - run: python scripts/update_sources.py
      - run: |
          git config user.name 'Yile-Wang-Lab Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data_raw data_processed metadata
          git diff --cached --quiet || git commit -m 'chore: update public data'
          git push
