name: Update public data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 5 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update World Bank GDP data
        run: python scripts/update_sources.py

      - name: Commit updated public data
        run: |
          git config user.name "Yile-Wang-Lab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data_raw
          git diff --cached --quiet || git commit -m "chore: update public data"
          git push
